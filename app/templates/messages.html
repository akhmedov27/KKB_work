{% for message in messages %}
<article class="message {{ message.role }}" data-message-id="{{ message.id }}">
  <div class="message-heading"><strong>{{ 'Вы' if message.role == 'user' else 'QMS · Тестовый помощник' }}</strong><time datetime="{{ message.created_at.strftime('%Y-%m-%dT%H:%M:%S') }}Z">{{ message.created_at.strftime('%d.%m.%Y %H:%M') }} UTC</time></div>
  <p>{{ message.content }}</p>
</article>
{% endfor %}
